name: fraud-monitoring

x-app: &app
  build: .
  image: fraud-monitoring-app:local
  restart: unless-stopped
  networks: [monitoring]
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    DATABASE_URL: postgresql://fraud:fraud_local@postgres:5432/fraud
    MODEL_DIR: /models

services:
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    networks: [monitoring]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.1
    networks: [monitoring]
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/bin/sh, -ec]
    command:
      - 'for topic in transactions scores transactions_dlq; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 1 --replication-factor 1; done'

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    networks: [monitoring]
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud_local
      POSTGRES_DB: fraud
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fraud -d fraud']
      interval: 3s
      timeout: 3s
      retries: 30

  model-init:
    <<: *app
    restart: 'no'
    command: [python, -m, app.train, --bootstrap, --seed, '42']
    volumes: [models:/models]

  trainer:
    <<: *app
    restart: 'no'
    profiles: [tools]
    command: [python, -m, app.train]
    volumes: [models:/models]

  generator:
    <<: *app
    command: [python, -m, app.generator]
    volumes: [control:/control]
    depends_on:
      kafka-init: {condition: service_completed_successfully}

  scorer:
    <<: *app
    command: [python, -m, app.scorer]
    ports: ['127.0.0.1:8000:8000']
    volumes: [models:/models:ro]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      model-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/metrics")']
      interval: 5s
      timeout: 3s
      retries: 20

  writer:
    <<: *app
    command: [python, -m, app.writer]
    ports: ['127.0.0.1:8001:8001']
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8001/metrics")']
      interval: 5s
      timeout: 3s
      retries: 20

  node-exporter:
    image: prom/node-exporter:v1.9.0
    restart: unless-stopped
    networks: [monitoring]
    command: [--path.procfs=/host/proc, --path.sysfs=/host/sys, --path.rootfs=/rootfs]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    networks: [monitoring]
    ports: ['127.0.0.1:9090:9090']
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=3d]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    networks: [monitoring]
    ports: ['127.0.0.1:3000:3000']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: fraud_monitoring
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres: {condition: service_healthy}
      prometheus: {condition: service_started}

networks:
  monitoring:

volumes:
  kafka-data:
  postgres-data:
  models:
  control:
  prometheus-data:
  grafana-data:
